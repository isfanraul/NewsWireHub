version: '3.8'
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: news
      MYSQL_ROOT_PASSWORD: test123
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - newswirehub-db-data:/var/lib/mysql

  api:
    build:
      context: ./backend
      args:
        db_host: db
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      - db

  ui:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  newswirehub-db-data:
