spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=admin
#spring.datasource.url=jdbc:mysql://localhost:3306/news
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/news
spring.datasource.hikari.maxLifeTime=600000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Comma-separated list of root sitemap index URLs to aggregate. Add or remove sources
# here - the channel name is derived generically from each source's own host, so any
# number of news sites can be plugged in without any code changes.
sitemap.news.sources=https://www.bbc.co.uk/sitemap.xml, https://www.reuters.com/sitemap.xml, https://apnews.com/sitemap.xml, https://www.npr.org/sitemap.xml

# Comma-separated list of full sitemap URLs to skip during mapping (per-source noise, ads, vouchers, etc.)
sitemaps.disallowed=

newswirehub.app.jwtExpirationMs=864000000
newswirehub.app.jwtCookieName=nwhKey
newswirehub.app.jwtSecret=changeMeToALongRandomSecretValueAtLeast64BytesForHS512InProduction
